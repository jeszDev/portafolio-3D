<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10192e" />
      <stop offset="100%" stop-color="#080d18" />
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>
  </defs>

  <!-- Contenedor redondeado estilo app -->
  <rect width="150" height="150" rx="34" fill="url(#bg)" />
  <rect x="0.75" y="0.75" width="148.5" height="148.5" rx="33.25" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.5" />

  <!-- Punto de la j -->
  <rect x="34" y="42" width="19" height="19" rx="4.5" fill="url(#whiteGrad)" />

  <!-- Gancho inferior de la j -->
  <path d="M 34 67
           C 34 65, 52 65, 52 67
           L 52 82
           C 52 94, 43 103, 29 107
           C 27 108, 26 105, 28 103
           C 35 97, 40 91, 40 82
           L 40 67 Z"
        fill="url(#whiteGrad)" />

  <!-- Chevron > -->
  <path d="M 67 55
           C 69 52, 74 53, 76 56
           L 102 75
           C 105 77, 105 80, 102 82
           L 76 101
           C 74 104, 69 105, 67 102
           C 65 99, 65 95, 68 93
           L 89 78.5
           L 68 64
           C 65 62, 65 58, 67 55 Z"
        fill="url(#orange)" />

  <!-- Cursor _ -->
  <rect x="70" y="95" width="53" height="11.5" rx="5.75" fill="url(#orange)" />
</svg>
