[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: client-side routes (e.g. /project/latidos) resolve to index.html.
# Existing files in dist are served first, so assets are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
